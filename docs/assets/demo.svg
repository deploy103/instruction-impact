@keyframes l7{0%,27.812%{opacity:0}27.823%,94%{opacity:1}100%{opacity:0}}
@keyframes l8{0%,31.250%{opacity:0}31.260%,94%{opacity:1}100%{opacity:0}}
@keyframes l9{0%,34.688%{opacity:0}34.697%,94%{opacity:1}100%{opacity:0}}
@keyframes l10{0%,38.125%{opacity:0}38.135%,94%{opacity:1}100%{opacity:0}}
@keyframes l11{0%,41.562%{opacity:0}41.572%,94%{opacity:1}100%{opacity:0}}
@keyframes l12{0%,45.000%{opacity:0}45.010%,94%{opacity:1}100%{opacity:0}}
@keyframes l13{0%,48.438%{opacity:0}48.447%,94%{opacity:1}100%{opacity:0}}
@keyframes l14{0%,51.875%{opacity:0}51.885%,94%{opacity:1}100%{opacity:0}}
@keyframes l15{0%,55.312%{opacity:0}55.322%,94%{opacity:1}100%{opacity:0}}
@keyframes l16{0%,58.750%{opacity:0}58.760%,94%{opacity:1}100%{opacity:0}}
@keyframes l17{0%,62.188%{opacity:0}62.198%,94%{opacity:1}100%{opacity:0}}
@keyframes l18{0%,65.625%{opacity:0}65.635%,94%{opacity:1}100%{opacity:0}}
