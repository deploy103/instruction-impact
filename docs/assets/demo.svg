<svg xmlns="http://www.w3.org/2000/svg" width="880" height="572" viewBox="0 0 880 572" role="img" aria-label="Animated terminal demo of instruction-impact reporting unchanged files affected by an AGENTS.md edit">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre;opacity:0}
.cmd{fill:#7ee787;font-weight:700}.dim{fill:#9da7b3}.cmt{fill:#6e7681;font-style:italic}
.hd{fill:#e6edf3;font-weight:700}.sec{fill:#79c0ff;font-weight:700}.warn{fill:#ffa657}.ok{fill:#d2a8ff}.hl{fill:#ffa657}
@keyframes l0{0%,3.750%{opacity:0}3.760%,94%{opacity:1}100%{opacity:0}}
@keyframes l1{0%,7.187%{opacity:0}7.197%,94%{opacity:1}100%{opacity:0}}
