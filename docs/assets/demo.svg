</style>
<rect width="880" height="572" rx="10" fill="#0d1117"/>
<rect width="880" height="40" rx="10" fill="#161b22"/><rect y="30" width="880" height="10" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#ff5f56"/><circle cx="44" cy="20" r="6" fill="#ffbd2e"/><circle cx="64" cy="20" r="6" fill="#27c93f"/>
<text x="440.0" y="25" text-anchor="middle" class="dim" style="opacity:1;font-size:13px">instruction-impact demo</text>
<text x="28" y="80" class="cmd" style="animation:l0 16.0s infinite">$ git diff --stat HEAD~1 HEAD</text>
<text x="28" y="104" class="dim" style="animation:l1 16.0s infinite"> api/AGENTS.md | 2 +-</text>
<text x="28" y="128" class="dim" style="animation:l2 16.0s infinite"> 1 file changed, 1 insertion(+), 1 deletion(-)</text>
<text x="28" y="152" class="dim" style="animation:l3 16.0s infinite"></text>
<text x="28" y="176" class="cmt" style="animation:l4 16.0s infinite"># Git sees one Markdown edit. What did it really change?</text>
<text x="28" y="200" class="cmd" style="animation:l5 16.0s infinite">$ instruction-impact HEAD~1 HEAD</text>
<text x="28" y="224" class="hd" style="animation:l6 16.0s infinite">Instruction impact: 2224fd90157c -&gt; 390e88f3ebbf [agents]</text>
<text x="28" y="248" class="hd" style="animation:l7 16.0s infinite">1 instruction change(s); 2 affected file(s); 2 with unchanged file content/mode.</text>
<text x="28" y="272" class="dim" style="animation:l8 16.0s infinite"></text>
<text x="28" y="296" class="sec" style="animation:l9 16.0s infinite">INSTRUCTION EDITS</text>
<text x="28" y="320" class="warn" style="animation:l10 16.0s infinite">  [modified] &quot;api/AGENTS.md&quot; - 2 affected file(s)</text>
<text x="28" y="344" class="dim" style="animation:l11 16.0s infinite">    selection: selected -&gt; selected</text>
<text x="28" y="368" class="dim" style="animation:l12 16.0s infinite"></text>
<text x="28" y="392" class="sec" style="animation:l13 16.0s infinite">CONTEXT TRANSITIONS</text>
<text x="28" y="416" class="ok" style="animation:l14 16.0s infinite">  [unchanged] &quot;api/auth.py&quot;</text>
<text x="28" y="440" class="dim" style="animation:l15 16.0s infinite">    before: &quot;AGENTS.md&quot;@fa088e0d -&gt; &quot;api/AGENTS.md&quot;@3de1b019</text>
<text x="28" y="464" class="hl" style="animation:l16 16.0s infinite">    after:  &quot;AGENTS.md&quot;@fa088e0d -&gt; &quot;api/AGENTS.md&quot;@07a33fe8</text>
<text x="28" y="488" class="ok" style="animation:l17 16.0s infinite">  [unchanged] &quot;api/deep/model.py&quot;</text>
<text x="28" y="512" class="dim" style="animation:l18 16.0s infinite">    before: &quot;AGENTS.md&quot;@fa088e0d -&gt; &quot;api/AGENTS.md&quot;@3de1b019</text>
<text x="28" y="536" class="hl" style="animation:l19 16.0s infinite">    after:  &quot;AGENTS.md&quot;@fa088e0d -&gt; &quot;api/AGENTS.md&quot;@07a33fe8</text>
</svg>
