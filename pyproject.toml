[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "instruction-impact"
version = "0.1.0"
description = "Review the file-level blast radius of AGENTS.md changes between Git commits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "deploy103"}]
dependencies = []

[project.scripts]
instruction-impact = "instruction_impact:main"

[project.urls]
Repository = "https://github.com/deploy103/instruction-impact"
Issues = "https://github.com/deploy103/instruction-impact/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/instruction_impact"]
